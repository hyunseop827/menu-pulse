# Releases the version in Packaging/Info.plist. Called by ci.yml after `make check` passes on a push to main;
# nothing else starts it, so every release comes from a checked commit on main and nobody pushes a tag by hand.
# .github/scripts/release-plan.py makes the decisions below; run it locally to see what CI will do.
#
# - Version not released yet: builds the DMGs and the ZIP with `make dmg`, signs the versioned DMG for Sparkle and
#   writes appcast.xml (.github/scripts/make-appcast.sh), tags the commit vX.Y.Z, publishes the release with the
#   notes of .github/release-notes.md, then downloads the assets and the feed again and checks them.
# - Version already released: nothing to do, unless the app changed since its tag without a new version, which fails.
# - "Re-run failed jobs" finishes a run that stopped half way, and checks the downloads of a release this commit
#   already published.
#
# In-app updates (Sparkle). appcast.xml has one item: this version, its build number (CFBundleVersion, the CI run
# number), the release notes, and the versioned DMG with an EdDSA signature made with the repository secret
#   SPARKLE_PRIVATE_KEY   the private key, base64, as `generate_keys --account menu-pulse -x` exports it. Only the
#                         owner creates and stores it; ci.yml passes it by name, and only the step that signs gets
#                         its value. The key check only learns whether it is set.
# A run that is going to publish stops
#   - in the plan, when SUPublicEDKey is not the key of the published releases that shipped with one;
#   - right after the plan, before anything is built or tagged, when the secret is missing or SUPublicEDKey is not a
#     real public key (the placeholder);
#   - after the build and before the tag, when the build number is not higher than the published feed's (or that
#     feed is missing although a release with Sparkle is out), or when the signature does not verify against the
#     app's own SUPublicEDKey.
# Menu Pulse 1.7.0's own updater still installs from MenuPulse.zip and SHA256SUMS.txt, so every release keeps them.
name: Release

on:
  workflow_call:
    secrets:
      # Not required: the key check below explains what to do, and only for runs that publish. Runs on main that
      # release nothing need no key.
      SPARKLE_PRIVATE_KEY:
        description: Sparkle's EdDSA private key (base64, from generate_keys -x); signs each release's DMG.
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # the version tag, gh release create / upload / edit
    concurrency:
      group: repository-release
      cancel-in-progress: false

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check version and release state
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-plan.py

      # The first thing a run that publishes does: without the key the DMG cannot be signed for the update feed,
      # and a release with the placeholder public key could never update. The step only learns whether the secret
      # is set, not its value.
      - name: Check the update signing key
        if: steps.prepare.outputs.publish == 'true'
        env:
          HAS_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if [[ "$HAS_PRIVATE_KEY" != true ]]; then
            echo "::error::The repository secret SPARKLE_PRIVATE_KEY is missing, so $RELEASE_TAG was not released (nothing was built or uploaded). The owner runs 'make sparkle', exports the private key with 'build/sparkle/2.10.0/bin/generate_keys --account menu-pulse -x <file>', adds it with 'gh secret set SPARKLE_PRIVATE_KEY --repo $GITHUB_REPOSITORY < <file>' (AGENTS.md, 'Update key (owner only)'), and then uses 'Re-run failed jobs'."
            exit 1
          fi
          key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Packaging/Info.plist 2> /dev/null || true)"
          if [[ ! "$key" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::SUPublicEDKey in Packaging/Info.plist is not an EdDSA public key ('$key'), so $RELEASE_TAG was not released. The owner adds the key that 'build/sparkle/2.10.0/bin/generate_keys --account menu-pulse' prints, in a new commit (AGENTS.md, 'Update key (owner only)')."
            exit 1
          fi
          echo "OK  SPARKLE_PRIVATE_KEY is set, SUPublicEDKey $key"

      # The run number becomes CFBundleVersion, which Sparkle compares.
      - name: Build DMG
        if: steps.prepare.outputs.publish == 'true'
        env:
          APP_BUILD: ${{ github.run_number }}
        run: make dmg APP_BUILD="$APP_BUILD"

      # Sparkle offers a build only when its number is higher than the installed copy's. The run number only grows,
      # unless ci.yml is renamed or recreated. So, before anything is tagged, compare with the feed installed copies
      # read now:
      #   200 with an integer sparkle:version  this build must be higher
      #   404, no release with Sparkle yet     the first Sparkle release (older releases have no appcast.xml)
      #   404, a release with Sparkle is out   stop: the number installed copies compare with is unknown
      #   anything else                        stop: nothing is tagged yet, so "Re-run failed jobs" tries again
      - name: Check the build number
        if: steps.prepare.outputs.publish == 'true'
        env:
          FEED: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          SPARKLE_RELEASE: ${{ steps.prepare.outputs.sparkle_release }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/release/Menu Pulse.app/Contents/Info.plist")"
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || fail "CFBundleVersion of the built app is not an integer ('$build')."
          published="$RUNNER_TEMP/published-appcast.xml"
          rm -f "$published"
          # Without -f, so the status is read; curl prints 000 when there was no answer.
          status="$(curl -sSL --retry 3 -o "$published" -w '%{http_code}' "$FEED" || true)"
          if [[ "$status" == 404 ]]; then
            if [[ -n "$SPARKLE_RELEASE" ]]; then
              fail "There is no published appcast.xml (HTTP 404, $FEED), but $SPARKLE_RELEASE already shipped with Sparkle, so the build number installed copies compare with is unknown. Check that the latest release has appcast.xml."
            fi
            echo "::notice::No appcast.xml is published yet and no release has shipped with an update key: this is the first Sparkle release, with build number $build."
            exit 0
          fi
          [[ "$status" == 200 ]] || fail "Could not read the published appcast.xml (HTTP $status, $FEED), so the build number cannot be compared. Use 'Re-run failed jobs' later."
          previous="$(xmllint --xpath 'string(//item/*[local-name()="version"])' "$published" 2> /dev/null || true)"
          [[ "$previous" =~ ^[0-9]+$ ]] || fail "Could not read sparkle:version from the published appcast.xml ('$previous')."
          if (( 10#$build <= 10#$previous )); then
            fail "Build number $build is not higher than the published release's ($previous), so installed copies would not see this version as an update. Check whether the CI run number restarted (for example after renaming ci.yml)."
          fi
          echo "OK  build number $build > published $previous"

      # Before the tag, so a key that does not match SUPublicEDKey never leaves a tag behind. The item points at the
      # versioned DMG, which later releases never replace.
      - name: Create the update feed
        if: steps.prepare.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sparkle_bin="$(make -s print-sparkle-bin)"
          SPARKLE_BIN="$sparkle_bin" ./.github/scripts/make-appcast.sh \
            "build/release/Menu Pulse.app" "dist/MenuPulse-$VERSION.dmg" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/MenuPulse-$VERSION.dmg" \
            "$RUNNER_TEMP/menu-pulse-appcast-notes.md" dist/appcast.xml
          cat dist/appcast.xml

      # Only after the build and the feed are checked, so a failure never leaves a tag behind. The token is handed to
      # this one git command (the checkout keeps no credentials), the way actions/checkout authenticates.
      - name: Create and push version tag
        if: steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$RELEASE_TAG" --cleanup=verbatim -F .github/release-notes.md "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_STATE: ${{ steps.prepare.outputs.release_state }}
        run: |
          set -euo pipefail
          [[ -s dist/appcast.xml ]] || { echo "::error::dist/appcast.xml is missing; no release without an update feed."; exit 1; }
          title="Menu Pulse $VERSION"
          if [[ "$RELEASE_STATE" == none ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$title" \
              --notes-file "$RUNNER_TEMP/menu-pulse-release-body.md"
          fi
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != true ]]; then
            echo "::error::$RELEASE_TAG is not a draft (isDraft: '$is_draft'); a published release is never changed."
            exit 1
          fi
          # appcast.xml goes up with the DMG it describes while the release is still a draft: installed copies read
          # it the moment the release becomes the latest one.
          gh release upload "$RELEASE_TAG" \
            dist/MenuPulse.dmg "dist/MenuPulse-$VERSION.dmg" dist/MenuPulse.zip \
            dist/SHA256SUMS.txt dist/appcast.xml --clobber
          gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/menu-pulse-release-body.md" \
            --draft=false --prerelease=false --latest

      - name: Re-download and verify published assets
        if: steps.prepare.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/menu-pulse-release-verify.XXXXXX")"
          mount_dir="$VERIFY_DIR/mount"
          trap 'hdiutil detach -quiet -force "$mount_dir" 2> /dev/null || true; rm -rf -- "$VERIFY_DIR"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$VERIFY_DIR" \
            --pattern MenuPulse.dmg \
            --pattern "MenuPulse-$VERSION.dmg" \
            --pattern MenuPulse.zip \
            --pattern SHA256SUMS.txt \
            --pattern appcast.xml
          cd "$VERIFY_DIR"
          # The DMGs and the ZIP that Menu Pulse 1.7.0's own updater installs.
          shasum -a 256 -c SHA256SUMS.txt
          hdiutil verify -quiet MenuPulse.dmg
          cmp -s MenuPulse.dmg "MenuPulse-$VERSION.dmg" || fail "MenuPulse.dmg and MenuPulse-$VERSION.dmg differ."

          # The feed Sparkle reads: one item about this version, pointing at this release's versioned DMG, with the
          # DMG's size, the build number of the app inside it, and a signature this commit's SUPublicEDKey accepts.
          feed_value() { xmllint --xpath "string($1)" appcast.xml 2> /dev/null || true; }
          xmllint --noout appcast.xml || fail "appcast.xml is not well-formed XML."
          [[ "$(feed_value 'count(//item)')" == 1 ]] || fail "appcast.xml does not have exactly one item."
          feed_build="$(feed_value '//item/*[local-name()="version"]')"
          short="$(feed_value '//item/*[local-name()="shortVersionString"]')"
          url="$(feed_value '//item/enclosure/@url')"
          length="$(feed_value '//item/enclosure/@length')"
          signature="$(feed_value '//item/enclosure/@*[local-name()="edSignature"]')"
          [[ "$feed_build" =~ ^[1-9][0-9]*$ ]] || fail "sparkle:version in appcast.xml is not an integer: '$feed_build'."
          [[ "$short" == "$VERSION" ]] || fail "appcast.xml lists version '$short', not $VERSION."
          [[ "$url" == "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/MenuPulse-$VERSION.dmg" ]] ||
            fail "appcast.xml points at '$url'."
          [[ "$length" == "$(stat -f %z "MenuPulse-$VERSION.dmg")" ]] ||
            fail "The length in appcast.xml ($length) is not the size of MenuPulse-$VERSION.dmg."
          mkdir "$mount_dir"
          hdiutil attach -quiet -readonly -nobrowse -noautoopen -mountpoint "$mount_dir" "MenuPulse-$VERSION.dmg" ||
            fail "Could not open MenuPulse-$VERSION.dmg."
          app_plist="$mount_dir/Menu Pulse.app/Contents/Info.plist"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist" 2> /dev/null || true)"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist" 2> /dev/null || true)"
          # hdiutil sometimes reports "Resource busy" for a moment; the mount is read-only.
          hdiutil detach -quiet "$mount_dir" || { sleep 2; hdiutil detach -quiet "$mount_dir"; } ||
            hdiutil detach -quiet -force "$mount_dir"
          [[ "$app_version" == "$VERSION" ]] || fail "The app in the DMG is version '$app_version', not $VERSION."
          [[ "$feed_build" == "$app_build" ]] ||
            fail "sparkle:version ($feed_build) is not the CFBundleVersion of the app in the DMG ('$app_build')."
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$GITHUB_WORKSPACE/Packaging/Info.plist")"
          verified=0
          xcrun swift "$GITHUB_WORKSPACE/.github/scripts/ed25519-verify.swift" \
            "$public_key" "MenuPulse-$VERSION.dmg" "$signature" || verified=$?
          [[ $verified == 0 ]] || fail "The appcast.xml signature does not verify with SUPublicEDKey (exit $verified)."

          # SUFeedURL and the README link read the latest release. This release must be the latest one (an older
          # version stops in the plan), but GitHub can take a few seconds to report it after publishing.
          for attempt in 1 2 3 4 5 6; do
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || true)"
            if [[ "$latest_tag" == "$RELEASE_TAG" ]] &&
              curl -fsSL -o latest-appcast.xml \
                "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" &&
              cmp -s latest-appcast.xml appcast.xml &&
              curl -fsSL -o latest.dmg "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/MenuPulse.dmg" &&
              cmp -s latest.dmg MenuPulse.dmg; then
              break
            fi
            if [[ $attempt == 6 ]]; then
              fail "The latest release is '$latest_tag', not $RELEASE_TAG, or releases/latest/download does not serve this release's appcast.xml and MenuPulse.dmg."
            fi
            sleep $((attempt * 10))
          done
          echo "OK  $RELEASE_TAG: assets, appcast.xml (build $feed_build, signature verified), and the latest links"
