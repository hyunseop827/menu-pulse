name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # The tags let the release plan compare the update key with the releases already published.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The same decision the release job makes, without publishing: a missing version bump or notes header, or an
      # update key that differs from the published releases', fails before the merge.
      - name: Check version and release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-plan.py --check

      - name: Check, build, and test
        run: make check

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # By name, not `secrets: inherit`: the release workflow gets this one secret and no other.
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
